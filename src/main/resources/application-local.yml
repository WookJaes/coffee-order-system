server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/local-migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.coffeeordersystem.outbox.dto
        spring.json.value.default.type: com.example.coffeeordersystem.outbox.dto.OrderPaidEvent

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

outbox:
  publisher:
    topic: ${OUTBOX_TOPIC}
    fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY}
    batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE}
    max-retry-count: ${OUTBOX_PUBLISHER_MAX_RETRY_COUNT}
    retry-backoff: ${OUTBOX_PUBLISHER_RETRY_BACKOFF}
    processing-timeout: ${OUTBOX_PUBLISHER_PROCESSING_TIMEOUT}

ranking:
  consumer:
    enabled: ${RANKING_CONSUMER_ENABLED}
    topic: ${RANKING_CONSUMER_TOPIC}
    group-id: ${RANKING_CONSUMER_GROUP_ID}
    dlt-topic: ${RANKING_CONSUMER_DLT_TOPIC}
    max-retry-attempts: ${RANKING_CONSUMER_MAX_RETRY_ATTEMPTS}
    retry-backoff: ${RANKING_CONSUMER_RETRY_BACKOFF}
    concurrency: ${RANKING_CONSUMER_CONCURRENCY}
  redis:
    key-ttl: ${RANKING_REDIS_KEY_TTL}
    rebuild-lock-ttl: ${RANKING_REDIS_REBUILD_LOCK_TTL}
    rebuild-lock-renew-interval: ${RANKING_REDIS_REBUILD_LOCK_RENEW_INTERVAL}

data-platform:
  api-url: ${DATA_PLATFORM_API_URL}
  connect-timeout: ${DATA_PLATFORM_CONNECT_TIMEOUT}
  read-timeout: ${DATA_PLATFORM_READ_TIMEOUT}
  consumer:
    enabled: ${DATA_PLATFORM_CONSUMER_ENABLED}
    topic: ${DATA_PLATFORM_CONSUMER_TOPIC}
    group-id: ${DATA_PLATFORM_CONSUMER_GROUP_ID}
    dlt-topic: ${DATA_PLATFORM_CONSUMER_DLT_TOPIC}
    max-retry-attempts: ${DATA_PLATFORM_CONSUMER_MAX_RETRY_ATTEMPTS}
    retry-backoff: ${DATA_PLATFORM_CONSUMER_RETRY_BACKOFF}
    concurrency: ${DATA_PLATFORM_CONSUMER_CONCURRENCY}
