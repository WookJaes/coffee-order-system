spring:
  datasource:
    url: jdbc:h2:mem:coffee-order;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

outbox:
  publisher:
    topic: order-paid
    fixed-delay: PT1H
    batch-size: 100
    max-retry-count: 3
    retry-backoff: PT0S
    processing-timeout: PT1M
